# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: examcure-be
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_LEGACY_AUTH
        value: "false"
      - key: DEV_EXPOSE_OTP
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_QUESTION_MODEL
        value: gpt-5.6-luna
      - key: MONGODB_VECTOR_DIMENSIONS
        value: "1536"
