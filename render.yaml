# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: examcure-be
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_LEGACY_AUTH
        value: "false"
      - key: DEV_EXPOSE_OTP
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_QUESTION_MODEL
        value: gpt-5.6-luna
      - key: MONGODB_VECTOR_DIMENSIONS
        value: "1536"

  # Background workers do not have a free Render plan. This worker needs
  # LibreOffice and Poppler, which are installed by Dockerfile.worker.
  - type: worker
    name: examcure-material-worker
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile.worker
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_QUESTION_MODEL
        value: gpt-5.6-luna
      - key: MONGODB_DATABASE
        value: examcure
      - key: MONGODB_VECTOR_COLLECTION
        value: material_chunks
      - key: MONGODB_VECTOR_INDEX
        value: material_vector_index
      - key: MONGODB_VECTOR_DIMENSIONS
        value: "1536"
      - key: MATERIAL_WORKER_NAME
        value: render-material-worker
